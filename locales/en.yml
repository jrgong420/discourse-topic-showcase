en:
  theme_metadata:
    description: "Shows topic lists as thumbnail cards, in a list or grid layout chosen per category."
    settings:
      cards_enabled: "Master switch. When off, topic lists are left untouched."
      default_layout_desktop: "Desktop layout for topic lists without a category-specific rule (latest, tag pages, uncategorised lists). \"none\" keeps the standard list."
      default_layout_mobile: "Mobile layout for topic lists without a category-specific rule (latest, tag pages, uncategorised lists). \"none\" keeps the standard list."
      list_view_categories: "Categories shown as a list of cards on desktop."
      grid_view_categories: "Categories shown as a grid of cards on desktop."
      mobile_list_view_categories: "Categories shown as a list of cards on mobile."
      mobile_grid_view_categories: "Categories shown as a grid of cards on mobile."
      inherit_layout_to_subcategories: "Subcategories without their own rule use the layout of their nearest listed parent category."
      show_excerpt: "Show the topic excerpt on cards."
      show_category: "Show the category badge on cards."
      show_tags: "Show the tags on cards."
      show_author: "Show the author's avatar and username on cards."
      show_reply_count: "Show the reply count on cards."
      show_likes: "Show the like count on cards."
      show_views: "Show the view count on cards."
      show_activity: "Show the time of the last activity on cards."
      show_publish_date: "Show the publish date on cards."
      show_sort_dropdown: "Show a sort dropdown next to the category and tag dropdowns on card lists."
      grid_card_min_width: "Minimum card width in pixels for the grid layout. Cards grow to fill the row."
      thumbnail_placeholder_icon: "Icon shown on cards whose topic has no image. Use an icon from the default icon set, or add the icon via svg_icons."
      card_border_radius: "Corner rounding of cards."
  showcase:
    sort:
      label: "Sort by"
      default: "Default"
      reverse: "Reverse order"
    replies: "Replies"
    likes: "Likes"
    views: "Views"
    activity: "Last activity"
    published: "Published"
