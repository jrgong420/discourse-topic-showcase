en:
  theme_metadata:
    description: "Shows topic lists as thumbnail cards, in a list or grid layout chosen per category."
    settings:
      cards_enabled: "Master switch. When off, topic lists are left untouched."
      default_layout_desktop: "Desktop layout for topic lists without a category-specific rule (latest, tag pages, uncategorised lists). \"none\" keeps the standard list."
      default_layout_mobile: "Mobile layout for topic lists without a category-specific rule (latest, tag pages, uncategorised lists). \"none\" keeps the standard list."
      list_view_categories: "Categories shown as a list of cards on desktop."
      grid_view_categories: "Categories shown as a grid of cards on desktop."
      mobile_list_view_categories: "Categories shown as a list of cards on mobile."
      mobile_grid_view_categories: "Categories shown as a grid of cards on mobile."
      inherit_layout_to_subcategories: "Subcategories without their own rule use the layout of their nearest listed parent category."
      list_view_tags: "Tags whose pages are shown as a list of cards, on desktop and mobile. A tag rule beats the category rules and the defaults. On a page with further tags (a tag intersection) only the first tag counts. Tags are matched by name, ignoring case. If a tag is also in grid_view_tags, the list wins."
      grid_view_tags: "Tags whose pages are shown as a grid of cards, on desktop and mobile. A tag rule beats the category rules and the defaults. On a page with further tags (a tag intersection) only the first tag counts. Tags are matched by name, ignoring case. If a tag is also in list_view_tags, the list wins."
      list_view_tag_groups: "Names of tag groups whose tags are shown as a list of cards on their pages, on desktop and mobile. Applies to a tag that is not listed in list_view_tags or grid_view_tags itself, and beats the category rules and the defaults. The groups must be visible to the visitors; the tags of the groups are loaded once when the page opens, and until then the groups do not apply. If a tag is also in a group of grid_view_tag_groups, the list wins."
      grid_view_tag_groups: "Names of tag groups whose tags are shown as a grid of cards on their pages, on desktop and mobile. Applies to a tag that is not listed in list_view_tags or grid_view_tags itself, and beats the category rules and the defaults. The groups must be visible to the visitors; the tags of the groups are loaded once when the page opens, and until then the groups do not apply. If a tag is also in a group of list_view_tag_groups, the list wins."
      show_excerpt: "Show the topic excerpt on cards."
      show_category: "Show the category badge on cards."
      show_tags: "Show the tags on cards."
      show_author: "Show the author's avatar and username on cards."
      show_reply_count: "Show the reply count on cards."
      show_likes: "Show the like count on cards."
      show_views: "Show the view count on cards."
      show_activity: "Show the time of the last activity on cards."
      show_publish_date: "Show the publish date on cards."
      show_sort_dropdown: "Show a sort dropdown next to the category and tag dropdowns on card lists."
      grid_card_min_width: "Smallest width in pixels a card in the grid layout may have. It decides how many columns fit in a row: the more room there is, the more columns, and the cards grow to fill the row. Larger values give fewer, wider cards."
      thumbnail_ratio: "Shape of every card thumbnail (width to height): 16:9, 3:2, 4:3 or 1:1. It applies to the grid, list and carousel cards and to the contest entries, on all screen sizes. In the list layout from the sm breakpoint (640px) up, the card is as tall as its thumbnail."
      list_card_height: "Height in pixels of each card in the list layout, on screens from the sm breakpoint (640px) up. 0 = automatic: the card is as tall as its thumbnail, which has the shape of thumbnail_ratio. With only the height set, the thumbnail width follows from it and thumbnail_ratio. With list_thumbnail_width set as well, both values are applied as given and thumbnail_ratio is no longer guaranteed. Content that does not fit is cut at a whole line. Narrow screens always use automatic height."
      list_thumbnail_width: "Width in pixels of the thumbnail in the list layout, on screens from the sm breakpoint (640px) up. 0 = automatic: about a third of the card, between 88 and 224 pixels. The thumbnail height follows from thumbnail_ratio, and the card is as tall as the thumbnail. With list_card_height set as well, both values are applied as given and thumbnail_ratio is no longer guaranteed. Narrow screens show the thumbnail on top at full width."
      card_gap: "Space in pixels between cards, in the list and grid layouts (the carousel slides and the contest entries use it too). 0 = no space between the cards."
      thumbnail_placeholder_icon: "Icon shown on cards whose topic has no image. Use an icon from the default icon set, or add the icon via svg_icons."
      card_border_radius: "Corner rounding of cards."
      status_badges:
        description: "Tags that are shown as a status badge over the thumbnail of a card (for example the phase of a grow report or the status of a contest). The order is the priority: a topic gets the badge of the first entry whose tag it carries, and only one badge. A tag shown as a badge is left out of the tag row of the card. The icon must be in the default icon set, or be added via svg_icons."
        schema:
          properties:
            tag:
              label: "Tag"
              description: "Name of the tag that gives the status (ignoring case)."
            label:
              label: "Label"
              description: "Text of the badge."
            color:
              label: "Colour"
              description: "Optional. A hex colour such as #3a8f3a, or a colour name such as green. It is shown as a dot before the label, or colours the icon. Empty = neutral."
            icon:
              label: "Icon"
              description: "Optional. Name of an icon shown before the label instead of the dot. Use an icon from the default icon set, or add the icon via svg_icons. Empty = no icon."
            show_week:
              label: "Week"
              description: "Show the running week next to the label (W5), counted from the start date of the topic's calendar event (needs the Discourse Calendar plugin and its site setting that shows event dates on topic titles). The count stops at the end date of the event, if it has one and it has passed. Topics without an event, or with a start in the future, show no week. Leave off for statuses where counting makes no sense (finished, aborted)."
      carousel_enabled: "Show a carousel of featured topics above the topic list on the forum homepage. Needs at least one tag in carousel_filter_tags."
      carousel_title: "Title of the carousel. Leave empty to use the default title (\"Featured\")."
      carousel_filter_tags: "Topics must carry all of these tags to appear in the carousel. With no tags the carousel is not shown."
      carousel_max_items: "Maximum number of topics in the carousel."
      carousel_order: "Order of the carousel topics. latest = most recently active first, created = newest topic first, random = shuffled on each page load."
      carousel_display_expired_events: "Show topics whose calendar event is over (needs the Discourse Calendar plugin). Topics without event dates are never hidden. Needs the Discourse Calendar site setting that shows event dates on topic titles; without it topic lists carry no event dates and nothing is filtered."
      carousel_display_upcoming_events: "Show topics whose calendar event has not started yet (needs the Discourse Calendar plugin). Topics without event dates are never hidden. Needs the Discourse Calendar site setting that shows event dates on topic titles; without it topic lists carry no event dates and nothing is filtered."
      carousel_slides_per_view: "Number of cards visible at once on large screens. Narrow screens always show one card, with part of the next one visible."
      carousel_scroll_by: "How far the arrows move the carousel: by one card, or by a full page of visible cards. Applies to both carousels (featured topics and subcategories)."
      carousel_loop: "Continue from the last card back to the first, and the other way round. With few cards the arrows jump to the other end instead. Applies to both carousels (featured topics and subcategories)."
      carousel_collapsible: "Let visitors collapse the carousel. The choice is remembered per browser, and a collapsed carousel shows how many topics are new since it was last open."
      carousel_show_excerpt: "Show the topic excerpt on carousel cards (clamped to two lines)."
      carousel_show_tags: "Show the tags on carousel cards (one line)."
      carousel_show_reply_count: "Show the reply count on carousel cards."
      carousel_show_likes: "Show the like count on carousel cards."
      carousel_show_activity: "Show the time of the last activity on carousel cards."
      subcategory_carousel_categories: "Categories whose subcategories are shown as a carousel above the topic list. It replaces the category's own subcategory list on its pages. Subcategories of listed categories do not get a carousel of their own unless they are listed too."
      subcategory_carousel_min_children: "Minimum number of subcategories the visitor can see for the carousel to appear. With fewer, the category's normal subcategory list (if any) is shown."
      contest_enabled: "Show contests: on the announcement topic a strip under the title and a list of all entries, and on every entry a link back to the announcement. Needs contest_tag_group, and announcement tags (contest_announcement_tags or carousel_filter_tags)."
      contest_tag_group: "Name of the tag group whose tags are contest tags. Entries and the announcement of a contest carry the same contest tag. Leave empty to turn contests off. The group must be visible to the visitors who should see contests."
      contest_announcement_tags: "A topic is a contest announcement when it carries a contest tag and all of these tags; other topics with a contest tag are entries. When empty, carousel_filter_tags is used instead. With neither, contests are not shown."
      contest_entries_position: "Where the list of contest entries appears on the announcement topic. top = hidden under the strip below the title and opened with its Show entries button; after_first_post = always visible after the first post, and the strip button scrolls to it."
      contest_entries_show_tags: "Show the tags on the cards in the list of contest entries."
      contest_entries_layout: "How the contest entries are shown: list = stacked rows with the thumbnail on the left, grid = cards in columns."
      contest_entries_order: "Order of the entries. latest = most recently active first, created = newest topic first."
      contest_max_entries: "Maximum number of entry cards in the list of entries. A link to all entries appears when there are more."
      contest_strip_avatars: "Number of participant avatars in the strip under the title. 0 shows none. The avatars are those of the creators of the entries, each participant once, in the order of the entries; if there are more participants, a +n chip ends the row."
  showcase:
    sort:
      label: "Sort by"
      default: "Default"
      reverse: "Reverse order"
    replies: "Replies"
    likes: "Likes"
    views: "Views"
    activity: "Last activity"
    published: "Published"
    week: "Week %{number}"
    week_short: "W%{number}"
    carousel:
      default_title: "Featured"
      collapse: "Collapse %{title}"
      expand: "Expand %{title}"
      previous: "Previous"
      next: "Next"
      pagination_label: "Go to slide group %{number}"
      slide_label: "%{current} of %{total}"
      new_count:
        one: "%{count} new"
        other: "%{count} new"
    subcategories:
      label: "Subcategories of %{category}"
      topic_count:
        one: "%{number} topic"
        other: "%{number} topics"
  contest:
    strip_label: "Contest participants"
    participants:
      one: "%{count} participant"
      other: "%{count} participants"
    participants_more: "%{count}+ participants"
    show_entries: "Show entries"
    hide_entries: "Hide entries"
    heading: "Entries (%{number})"
    view_all: "View all entries"
    backlink: "Part of the contest:"
