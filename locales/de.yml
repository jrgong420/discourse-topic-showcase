de:
  theme_metadata:
    description: "Zeigt Themenlisten als Karten mit Vorschaubild, je Kategorie als Liste oder Raster."
    settings:
      cards_enabled: "Hauptschalter. Wenn aus, bleiben Themenlisten unverändert."
      default_layout_desktop: "Desktop-Layout für Themenlisten ohne kategoriespezifische Regel (Neueste, Tag-Seiten, Listen ohne Kategorie). \"none\" behält die Standardliste."
      default_layout_mobile: "Mobil-Layout für Themenlisten ohne kategoriespezifische Regel (Neueste, Tag-Seiten, Listen ohne Kategorie). \"none\" behält die Standardliste."
      list_view_categories: "Kategorien, die auf dem Desktop als Kartenliste angezeigt werden."
      grid_view_categories: "Kategorien, die auf dem Desktop als Kartenraster angezeigt werden."
      mobile_list_view_categories: "Kategorien, die mobil als Kartenliste angezeigt werden."
      mobile_grid_view_categories: "Kategorien, die mobil als Kartenraster angezeigt werden."
      inherit_layout_to_subcategories: "Unterkategorien ohne eigene Regel verwenden das Layout der nächsten aufgeführten übergeordneten Kategorie."
      show_excerpt: "Auszug des Themas auf den Karten anzeigen."
      show_category: "Kategorie-Badge auf den Karten anzeigen."
      show_tags: "Tags auf den Karten anzeigen."
      show_author: "Avatar und Benutzername des Autors auf den Karten anzeigen."
      show_reply_count: "Anzahl der Antworten auf den Karten anzeigen."
      show_likes: "Anzahl der Likes auf den Karten anzeigen."
      show_views: "Anzahl der Aufrufe auf den Karten anzeigen."
      show_activity: "Zeitpunkt der letzten Aktivität auf den Karten anzeigen."
      show_publish_date: "Veröffentlichungsdatum auf den Karten anzeigen."
      show_sort_dropdown: "Sortier-Dropdown neben der Kategorie- und Tag-Auswahl bei Kartenlisten anzeigen."
      grid_card_min_width: "Kleinste Breite in Pixeln, die eine Karte im Rasterlayout haben darf. Sie bestimmt, wie viele Spalten in eine Zeile passen: je mehr Platz, desto mehr Spalten, und die Karten wachsen, um die Zeile zu füllen. Größere Werte ergeben weniger, breitere Karten."
      thumbnail_ratio: "Form jedes Karten-Vorschaubilds (Breite zu Höhe): 16:9, 3:2, 4:3 oder 1:1. Gilt für Raster-, Listen- und Karussell-Karten sowie für die Wettbewerbsbeiträge, auf allen Bildschirmgrößen. Im Listenlayout ab dem Breakpoint sm (640px) ist die Karte so hoch wie ihr Vorschaubild."
      list_card_height: "Höhe in Pixeln jeder Karte im Listenlayout, auf Bildschirmen ab dem Breakpoint sm (640px). 0 = automatisch: die Karte ist so hoch wie ihr Vorschaubild, das die Form von thumbnail_ratio hat. Ist nur die Höhe gesetzt, ergibt sich die Breite des Vorschaubilds aus ihr und thumbnail_ratio. Ist zusätzlich list_thumbnail_width gesetzt, werden beide Werte wie angegeben angewendet, und thumbnail_ratio wird nicht mehr garantiert. Inhalt, der nicht passt, wird an einer ganzen Zeile abgeschnitten. Schmale Bildschirme verwenden immer die automatische Höhe."
      list_thumbnail_width: "Breite in Pixeln des Vorschaubilds im Listenlayout, auf Bildschirmen ab dem Breakpoint sm (640px). 0 = automatisch: etwa ein Drittel der Karte, zwischen 88 und 224 Pixeln. Die Höhe des Vorschaubilds ergibt sich aus thumbnail_ratio, und die Karte ist so hoch wie das Vorschaubild. Ist zusätzlich list_card_height gesetzt, werden beide Werte wie angegeben angewendet, und thumbnail_ratio wird nicht mehr garantiert. Schmale Bildschirme zeigen das Vorschaubild oben in voller Breite."
      card_gap: "Abstand in Pixeln zwischen den Karten im Listen- und Rasterlayout (auch die Karussell-Folien und die Wettbewerbsbeiträge verwenden ihn). 0 = kein Abstand zwischen den Karten."
      thumbnail_placeholder_icon: "Symbol für Karten, deren Thema kein Bild hat. Verwende ein Symbol aus dem Standard-Symbolsatz oder ergänze es über svg_icons."
      card_border_radius: "Rundung der Kartenecken."
      carousel_enabled: "Zeigt auf der Startseite des Forums über der Themenliste ein Karussell mit empfohlenen Themen. Benötigt mindestens einen Tag in carousel_filter_tags."
      carousel_title: "Titel des Karussells. Leer lassen, um den Standardtitel (\"Empfohlen\") zu verwenden."
      carousel_filter_tags: "Themen müssen alle diese Tags tragen, um im Karussell zu erscheinen. Ohne Tags wird das Karussell nicht angezeigt."
      carousel_max_items: "Maximale Anzahl der Themen im Karussell."
      carousel_order: "Reihenfolge der Themen im Karussell. latest = zuletzt aktive zuerst, created = neuestes Thema zuerst, random = bei jedem Seitenaufruf zufällig gemischt."
      carousel_display_expired_events: "Themen anzeigen, deren Kalendertermin vorbei ist (benötigt das Discourse-Calendar-Plugin). Themen ohne Termin werden nie ausgeblendet. Benötigt die Discourse-Calendar-Einstellung, die Event-Daten am Thementitel anzeigt; ohne sie enthalten Themenlisten keine Event-Daten und es wird nichts gefiltert."
      carousel_display_upcoming_events: "Themen anzeigen, deren Kalendertermin noch nicht begonnen hat (benötigt das Discourse-Calendar-Plugin). Themen ohne Termin werden nie ausgeblendet. Benötigt die Discourse-Calendar-Einstellung, die Event-Daten am Thementitel anzeigt; ohne sie enthalten Themenlisten keine Event-Daten und es wird nichts gefiltert."
      carousel_slides_per_view: "Anzahl der gleichzeitig sichtbaren Karten auf großen Bildschirmen. Schmale Bildschirme zeigen immer eine Karte, von der nächsten ist ein Teil sichtbar."
      carousel_scroll_by: "Wie weit die Pfeile das Karussell bewegen: um eine Karte (card) oder um eine ganze Seite sichtbarer Karten (page). Gilt für beide Karussells (empfohlene Themen und Unterkategorien)."
      carousel_loop: "Von der letzten Karte wieder zur ersten springen und umgekehrt. Gilt für beide Karussells (empfohlene Themen und Unterkategorien)."
      carousel_collapsible: "Besucher können das Karussell einklappen. Die Wahl wird pro Browser gespeichert, und ein eingeklapptes Karussell zeigt an, wie viele Themen seit dem letzten Öffnen neu sind."
      carousel_show_excerpt: "Auszug des Themas auf den Karussell-Karten anzeigen (auf zwei Zeilen begrenzt)."
      carousel_show_tags: "Tags auf den Karussell-Karten anzeigen (eine Zeile)."
      carousel_show_reply_count: "Anzahl der Antworten auf den Karussell-Karten anzeigen."
      carousel_show_likes: "Anzahl der Likes auf den Karussell-Karten anzeigen."
      carousel_show_activity: "Zeitpunkt der letzten Aktivität auf den Karussell-Karten anzeigen."
      subcategory_carousel_categories: "Kategorien, deren Unterkategorien über der Themenliste als Karussell angezeigt werden. Es ersetzt auf den Seiten der Kategorie deren eigene Liste der Unterkategorien. Unterkategorien aufgeführter Kategorien bekommen kein eigenes Karussell, außer sie sind ebenfalls aufgeführt."
      subcategory_carousel_min_children: "Mindestanzahl an Unterkategorien, die der Besucher sehen kann, damit das Karussell erscheint. Bei weniger wird die normale Liste der Unterkategorien der Kategorie (falls vorhanden) angezeigt."
      contest_enabled: "Wettbewerbe anzeigen: im Ankündigungsthema eine Leiste unter dem Titel und eine Liste aller Beiträge, in jedem Wettbewerbsbeitrag einen Link zurück zur Ankündigung. Benötigt contest_tag_group und Ankündigungs-Tags (contest_announcement_tags oder carousel_filter_tags)."
      contest_tag_group: "Name der Tag-Gruppe, deren Tags Wettbewerbs-Tags sind. Die Beiträge und die Ankündigung eines Wettbewerbs tragen dasselbe Wettbewerbs-Tag. Leer lassen, um Wettbewerbe auszuschalten. Die Gruppe muss für die Besucher sichtbar sein, die Wettbewerbe sehen sollen."
      contest_announcement_tags: "Ein Thema ist eine Wettbewerbsankündigung, wenn es ein Wettbewerbs-Tag und alle diese Tags trägt; andere Themen mit einem Wettbewerbs-Tag sind Beiträge. Wenn leer, wird stattdessen carousel_filter_tags verwendet. Ist beides leer, werden Wettbewerbe nicht angezeigt."
      contest_entries_position: "Wo die Liste der Wettbewerbsbeiträge im Ankündigungsthema erscheint. top = unter der Leiste unter dem Titel verborgen und mit deren Schaltfläche „Beiträge anzeigen“ zu öffnen; after_first_post = immer sichtbar nach dem ersten Beitrag, und die Schaltfläche der Leiste scrollt dorthin."
      contest_entries_layout: "Wie die Wettbewerbsbeiträge angezeigt werden: list = untereinander als Zeilen mit dem Vorschaubild links, grid = Karten in Spalten."
      contest_entries_order: "Reihenfolge der Beiträge. latest = zuletzt aktive zuerst, created = neuestes Thema zuerst."
      contest_max_entries: "Maximale Anzahl der Beitragskarten in der Liste der Beiträge. Gibt es mehr, erscheint ein Link zu allen Beiträgen."
      contest_strip_thumbnails: "Anzahl der Beitrags-Vorschaubilder in der Leiste unter dem Titel. 0 zeigt keine. Beiträge ohne Bild werden übersprungen."
  showcase:
    sort:
