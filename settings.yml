grid_view_categories:
  type: list
  list_type: category
  default: ""

mobile_list_view_categories:
  type: list
  list_type: category
  default: ""

mobile_grid_view_categories:
  type: list
  list_type: category
  default: ""

inherit_layout_to_subcategories:
  type: bool
  default: false

list_view_tags:
  type: list
  list_type: tag
  default: ""

grid_view_tags:
  type: list
  list_type: tag
  default: ""

list_view_tag_groups:
  type: list
  list_type: tag_group
  default: ""

grid_view_tag_groups:
  type: list
  list_type: tag_group
  default: ""

show_excerpt:
  type: bool
  default: true

show_category:
  type: bool
  default: true

show_tags:
  type: bool
  default: true

show_author:
  type: bool
  default: true

show_reply_count:
  type: bool
  default: true

show_likes:
  type: bool
  default: true

show_views:
  type: bool
  default: false

show_activity:
  type: bool
  default: true

show_publish_date:
  type: bool
  default: false

show_sort_dropdown:
  type: bool
  default: true

grid_card_min_width:
  type: integer
  default: 260
  min: 160
  max: 600

thumbnail_ratio:
  type: enum
  default: "16:9"
  choices:
    - "16:9"
    - "3:2"
    - "4:3"
    - "1:1"

list_card_height:
  type: integer
  default: 0
  min: 0
  max: 600

list_thumbnail_width:
  type: integer
  default: 0
  min: 0
  max: 480

card_gap:
  type: integer
  default: 16
  min: 0
  max: 48

thumbnail_placeholder_icon:
  type: string
  default: "image"

card_border_radius:
  type: enum
  default: medium
  choices:
    - none
    - small
    - medium
    - large

status_badges:
  type: objects
  default: []
  schema:
    name: status badge
    properties:
      tag:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 100
      label:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 40
      color:
        type: string
        validations:
          max_length: 30
      icon:
        type: string
        validations:
          max_length: 60
      show_week:
        type: boolean
        default: false

carousel_enabled:
  type: bool
  default: false

carousel_title:
  type: string
  default: ""

carousel_filter_tags:
  type: list
  list_type: tag
  default: ""

carousel_max_items:
  type: integer
  default: 8
  min: 1
  max: 20

carousel_order:
  type: enum
  default: latest
  choices:
    - latest
    - created
    - random

carousel_display_expired_events:
  type: bool
  default: false

carousel_display_upcoming_events:
  type: bool
  default: true

carousel_slides_per_view:
  type: integer
  default: 3
  min: 1
  max: 6

carousel_scroll_by:
  type: enum
  default: card
  choices:
    - card
    - page

carousel_loop:
  type: bool
  default: true

carousel_collapsible:
  type: bool
  default: true

carousel_show_excerpt:
  type: bool
  default: false

carousel_show_tags:
